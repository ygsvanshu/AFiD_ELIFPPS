title: Documentation
description: Latest docs

remote_theme: pmarsceill/just-the-docs
plugins:
  - jekyll-remote-theme

# Math support
markdown: kramdown
kramdown:
  math_engine: mathjax
  math_engine_opts: ""
  syntax_highlighter: rouge
  input: GFM
  parse_block_html: true

# Permalinks
permalink: pretty


title: Documentation
description: Latest docs

remote_theme: pmarsceill/just-the-docs
plugins:
  - jekyll-remote-theme

# Math support
markdown: kramdown
kramdown:
  input: kramdown
  math_engine: mathjax
  parse_block_html: true

just_the_docs:
  extra_head: |
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

# Permalinks
permalink: pretty
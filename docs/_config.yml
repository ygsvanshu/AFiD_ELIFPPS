# Site settings
title: Documentation
description: Latest docs

# Theme
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

# Markdown
markdown: kramdown
kramdown:
  math_engine: nil        # Disable kramdown math (use MathJax)
  input: GFM              # GitHub Flavored Markdown
  hard_wrap: false        # Prevents unwanted <br> in display math
  parse_block_html: true  # Needed if you embed HTML, ensures MathJax inside HTML blocks works.

# Math support
math: mathjax  # enables MathJax v3 automatically

# Permalinks
permalink: pretty

# Color scheme supports "light" (default) and "dark"
color_scheme: dark
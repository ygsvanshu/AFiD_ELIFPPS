# Site settings
title: Documentation
description: Latest docs

# Theme
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

# Math support
math: true  # enables MathJax v3 automatically

# Markdown
markdown: kramdown
kramdown:
  input: kramdown          # MUST be 'kramdown', not 'GFM'
  syntax_highlighter: rouge

# Permalinks
permalink: pretty
        - Stability: 'numerics/stability.md'
    - Validation & Benchmarks: 'validation/index.md'
    - References: 'references.md'
  - Developer reference:
    - Project Architecture: 'architecture.md'
    - Code API & Modules: 'api.md'
    - Roadmap: 'roadmap.md'
    - TODO: 'todo.md'